<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Stock Radar V10</title><style>body{margin:0;background:#07111f;color:#eef5ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;margin:18px 0;overflow:auto}button,input{background:#102035;color:white;border:1px solid #29415e;border-radius:10px;padding:11px}button.active{background:#1769e0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0d1a2b;border:1px solid #20334a;border-radius:15px;padding:15px}.score{font-size:28px;font-weight:bold}.muted{color:#91a3b8;font-size:13px}.up{color:#45d99a}.down{color:#ff6878}@media(max-width:750px){.grid{grid-template-columns:1fr}}a{color:white}.bar{height:7px;background:#1c2d42;border-radius:9px}.fill{height:100%;background:#4b9cff}</style></head><body><main class="wrap"><h1>⚡ AI Stock Radar V10</h1><div class="muted">KOSPI · KOSDAQ · NASDAQ · 알고리즘 참고점수</div><div class="nav"><button class="active" data-m="ALL">전체</button><button data-m="KOSPI">KOSPI</button><button data-m="KOSDAQ">KOSDAQ</button><button data-m="NASDAQ">NASDAQ</button></div><input id="s" style="width:100%" placeholder="종목명 또는 티커 검색"><h2>🔥 현재 AI 추천</h2><div id="p" class="grid"></div><h2>📰 최신 금융뉴스</h2><div id="n"></div></main><script>let a=[],m="ALL";const $=x=>document.querySelector(x),e=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(){let q=$("#s").value.toLowerCase(),x=a.filter(v=>(m=="ALL"||v.market==m)&&(!q||v.symbol.toLowerCase().includes(q)||v.name.toLowerCase().includes(q)));$("#p").innerHTML=x.map((v,i)=>`<div class="card"><div class="muted">${e(v.market)} · #${i+1}</div><h3>${e(v.name)} <small>${e(v.symbol)}</small></h3><div class="score">${v.score}/100</div><p>가격 ${v.price} · <span class="${v.change>=0?"up":"down"}">${v.change>=0?"+":""}${v.change}%</span></p><div class="muted">모멘텀 ${v.momentum}</div><div class="bar"><div class="fill" style="width:${v.momentum}%"></div></div><div class="muted">거래량 ${v.volumeRatio}x</div></div>`).join("")||"<div class=card>검색 결과가 없습니다.</div>"}async function load(){p.innerHTML="<div class=card>시장 데이터 불러오는 중...</div>";try{let d=await(await fetch("/api/recommend?market="+m)).json();a=d.items||[];render()}catch(x){p.innerHTML="<div class=card>데이터 오류 — Vercel 로그를 확인하세요.</div>"}try{let d=await(await fetch("/api/news")).json();n.innerHTML=(d.news||[]).slice(0,12).map(x=>`<div class=card style="margin:8px 0"><a href="${e(x.link)}" target=_blank>${e(x.title)}</a><div class=muted>${e(x.source)} · ${e(x.timeText)}</div></div>`).join("")}catch(x){}}document.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");m=b.dataset.m;load()});s.oninput=render;load();setInterval(load,3600000)</script></body></html>
