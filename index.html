<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Stock Radar v8</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:5;background:#070a10dd;backdrop-filter:blur(14px);padding:10px 0}.bar{display:flex;gap:12px;align-items:center}.logo{font-size:25px;font-weight:800;flex:1}.btn,.search{background:#111823;border:1px solid #263348;color:#fff;border-radius:14px;padding:13px 16px;font-size:15px}.search{width:100%}.hero{margin-top:16px;padding:24px;border:1px solid #263348;border-radius:22px;background:linear-gradient(135deg,#101722,#0b1018)}h1{font-size:32px;margin:0 0 8px}.muted{color:#8e9bb0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.card{background:#0d131c;border:1px solid #263348;border-radius:22px;padding:20px}.card h2{margin:0 0 15px;font-size:21px}.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pick{padding:15px;border:1px solid #263348;border-radius:16px;background:#101722;cursor:pointer}.pick:hover{border-color:#58d8b2}.score{font-size:29px;font-weight:800}.green{color:#55ddb0}.red{color:#ff6b7b}.news{display:grid;gap:9px}.news a{color:#dbe5f5;text-decoration:none;padding:13px;border-bottom:1px solid #1b2636}.menu{display:flex;gap:8px;overflow:auto;margin-top:13px}.menu button{white-space:nowrap}.detail{margin-top:16px}.bigscore{font-size:55px;font-weight:900}.bars div{margin:10px 0}.track{height:9px;background:#202b3a;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#43d5aa,#73a8ff)}.table{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.5fr .8fr .8fr .6fr;gap:8px;padding:12px;border-bottom:1px solid #1c2737}.status{padding:9px 12px;border-radius:12px;background:#111923;color:#9aa8bb;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.picks{grid-template-columns:1fr}.row{grid-template-columns:1.4fr .8fr .8fr}.row>*:last-child{display:none}}
</style></head><body><div class="wrap"><div class="top"><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><div class="logo">📡 AI Stock Radar</div><button class="btn" onclick="loadAll()">↻ 새로고침</button></div><div id="menu" class="menu" style="display:none"><button class="btn" onclick="showNews('한국 뉴스','한국 증시 코스피 코스닥 기업 실적 금리')">한국뉴스</button><button class="btn" onclick="showNews('미국 뉴스','US stocks Wall Street Nasdaq S&P 500 Fed')">미국뉴스</button><button class="btn" onclick="showNews('AI·반도체','AI semiconductor NVIDIA HBM TSMC')">AI·반도체</button><button class="btn" onclick="showNews('금리·환율','Fed interest rates inflation USD KRW')">금리·환율</button></div></div>
<div class="hero"><h1>AI 기반 금융뉴스 & 주식 레이더</h1><div class="muted">한국 + 미국 주식 · 뉴스 모멘텀 · 가격 모멘텀 · 자동 점수</div><div style="margin-top:16px;display:flex;gap:8px"><input id="search" class="search" placeholder="종목명 또는 티커 검색 (예: 삼성전자, NVDA)"><button class="btn" onclick="searchStock()">검색</button></div></div>
<div id="detail" class="detail"></div><div class="grid"><section class="card"><h2>🔥 AI TOP PICKS <span class="muted" style="font-size:13px">KR + US</span></h2><div id="picks" class="picks"><div class="muted">계산 중...</div></div></section><section class="card"><h2>🌐 글로벌 시장</h2><div id="market" class="muted">시장 데이터 확인 중...</div></section></div>
<section class="card" style="margin-top:16px"><h2>⚡ 최신 금융뉴스 <span class="muted" style="font-size:13px">한국 + 미국 · 최근 48시간</span></h2><div id="news" class="news">뉴스 불러오는 중...</div></section>
<section class="card" style="margin-top:16px"><h2>📋 전체 종목</h2><div id="stocks" class="table"></div></section><p class="muted" style="font-size:12px;text-align:center;margin:24px 0">데이터는 지연될 수 있습니다. AI 점수는 참고용 알고리즘이며 투자조언이 아닙니다.</p></div>
<script>
const $=id=>document.getElementById(id);let all=[];
function toggleMenu(){const x=$('menu');x.style.display=x.style.display==='none'?'flex':'none'}
async function api(path){const r=await fetch(path,{cache:'no-store'});return r.json()}
async function loadAll(){
 $('picks').innerHTML='<div class="muted">계산 중...</div>'; $('market').innerHTML='시장 데이터 확인 중...';
 try{const d=await api('/api/dashboard');all=d.stocks||[];$('picks').innerHTML=(d.topPicks||[]).map(x=>`<div class="pick" onclick="detail('${x.symbol}')"><b>${x.name}</b><div class="muted">${x.symbol} · ${x.market}</div><div class="score">${x.aiScore}</div><span class="${x.changePct>=0?'green':'red'}">${x.changePct>=0?'+':''}${Number(x.changePct||0).toFixed(2)}%</span></div>`).join('')||'데이터 없음';$('stocks').innerHTML=all.map(x=>`<div class="row" onclick="detail('${x.symbol}')"><b>${x.name}</b><span>${x.market}</span><span class="${x.changePct>=0?'green':'red'}">${Number(x.changePct||0).toFixed(2)}%</span><span>${x.aiScore}</span></div>`).join('');$('market').innerHTML=`<div class="status">연결 정상 · ${new Date(d.updatedAt).toLocaleString('ko-KR')}</div>`;}catch(e){$('market').innerHTML='<span class="red">연결 실패: '+e.message+'</span>'}
 showNews('최신 금융뉴스','한국 주식 미국 주식 증시 AI 반도체 금리 환율');
}
async function showNews(title,q){$('news').innerHTML='<div class="muted">'+title+' 불러오는 중...</div>';try{const [a,b]=await Promise.all([api('/api/news?q='+encodeURIComponent(q)+'&lang=ko'),api('/api/news?q='+encodeURIComponent(q)+'&lang=en')]);const arr=[...(a.news||[]),...(b.news||[])].sort((x,y)=>new Date(y.pubDate)-new Date(x.pubDate)).slice(0,18);$('news').innerHTML=arr.map(n=>`<a href="${n.link}" target="_blank" rel="noopener"><b>${n.title}</b><div class="muted">${n.source} · ${n.timeText}</div></a>`).join('')||'뉴스가 없습니다.'}catch(e){$('news').innerHTML='<span class="red">뉴스 조회 실패 · 잠시 후 다시 시도하세요.</span>'}}
async function detail(symbol){$('detail').innerHTML='<section class="card">불러오는 중...</section>';try{const d=await api('/api/dashboard?symbol='+encodeURIComponent(symbol));const s=d.stock;$('detail').innerHTML=`<section class="card"><div class="muted">${s.market} · ${s.symbol} · ${s.sector}</div><h2 style="font-size:28px;margin:5px 0">${s.name}</h2><div class="bigscore">${d.aiScore}<span class="muted" style="font-size:15px"> / 100 AI 종합점수</span></div><div class="bars"><div>AI 점수<div class="track"><div class="fill" style="width:${d.aiScore}%"></div></div></div><div>전문가 관점 참고점수<div class="track"><div class="fill" style="width:${d.expertScore}%"></div></div><b>${d.expertScore}/100</b></div></div><div class="muted">현재가 ${d.quote.price??'데이터 없음'} · 최근 변동 ${Number(d.quote.changePct||0).toFixed(2)}% · 관련뉴스 ${d.newsCount}건</div></section>`;window.scrollTo({top:document.getElementById('detail').offsetTop-70,behavior:'smooth'})}catch(e){$('detail').innerHTML='<section class="card red">종목 데이터를 불러오지 못했습니다.</section>'}}
async function searchStock(){const q=$('search').value.trim();if(!q)return;const map=all.find(x=>x.name.toLowerCase()===q.toLowerCase()||x.symbol.toLowerCase()===q.toLowerCase());if(map)return detail(map.symbol);await detail(q)}
loadAll();setInterval(loadAll,5*60*1000);
</script></body></html>
