<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Stock Radar v8</title>
<style>
:root{--bg:#070a0f;--card:#10151d;--line:#253044;--text:#f4f7fb;--muted:#8d99ad;--a:#65d6b1;--b:#70a7ff;--r:#ff6f83}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0f,#0a0e15);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#070a0ff2;border-bottom:1px solid var(--line)}.nav,.wrap{max-width:1100px;margin:auto}.nav{padding:14px 18px;display:flex;align-items:center;gap:12px}.logo{font-weight:800;font-size:21px}.sp{flex:1}button,input{font:inherit}button{border:1px solid var(--line);background:#121923;color:white;border-radius:12px;padding:10px 13px}.wrap{padding:22px 18px 60px}.hero{padding:18px 0 12px}.hero h1{font-size:34px;margin:0 0 8px}.muted,.status{color:var(--muted)}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;background:#111720;color:white;border:1px solid var(--line);border-radius:13px;padding:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#10151df2;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.market{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.pick{border:1px solid var(--line);border-radius:14px;padding:13px}.metric small{display:block;color:var(--muted);margin-bottom:6px}.pick{margin:9px 0;cursor:pointer}.picktop{display:flex;justify-content:space-between}.score{font-size:24px;font-weight:800}.up{color:var(--a)}.down{color:var(--r)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs .active{background:#20312f;border-color:#397565}.news{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #202936}.thumb{width:90px;height:62px;object-fit:cover;border-radius:9px}.news a{color:white;text-decoration:none;font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:6px}.bar{height:10px;background:#202937;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.side{position:fixed;inset:0 auto 0 0;width:290px;background:#0c1119;border-right:1px solid var(--line);padding:22px;z-index:30;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.side button{display:block;width:100%;text-align:left;margin:8px 0}.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:20}.overlay.open{display:block}.hidden{display:none}.big{font-size:52px;font-weight:900}.op{line-height:1.6;font-size:16px}.chart{width:100%;height:180px;background:#0b1017;border:1px solid var(--line);border-radius:14px}.empty{padding:20px 0;color:var(--muted)}@media(max-width:700px){.market,.grid{grid-template-columns:repeat(2,1fr)}.grid .card{min-width:0}.hero h1{font-size:29px}.wrap{padding:16px 12px 45px}}@media(max-width:500px){.market,.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="ov" class="overlay" onclick="closeMenu()"></div><aside id="side" class="side"><h3>☰ 메뉴</h3>
<button onclick="showNews('한국뉴스','한국 경제 증시 코스피 코스닥','ko')">🇰🇷 한국뉴스</button><button onclick="showNews('미국뉴스','US stocks Wall Street Nasdaq S&P 500','en')">🇺🇸 미국뉴스</button><button onclick="showNews('AI·반도체','AI semiconductor NVIDIA AMD HBM','ko')">🤖 AI·반도체</button><button onclick="showNews('금리·환율','Fed interest rates inflation dollar USD KRW','en')">💵 금리·환율</button><button onclick="showNews('기업뉴스','earnings stocks companies business','en')">🏢 기업뉴스</button><button onclick="goHome()">🏠 홈</button></aside>
<header><div class="nav"><button onclick="openMenu()">☰</button><div class="logo">📡 AI Stock Radar</div><div class="sp"></div><button onclick="refreshAll()">↻ 새로고침</button></div></header>
<main class="wrap">
<section id="home"><div class="hero"><h1>AI 금융뉴스 & 주식 레이더</h1><p class="muted">한국·미국 시장 · 뉴스 · 가격 흐름 · AI 참고점수</p></div>
<div class="search"><input id="q" placeholder="삼성전자, NVDA, Apple..." onkeydown="if(event.key==='Enter')searchStock()"><button onclick="searchStock()">검색</button></div>
<div class="card"><h2>📊 글로벌 시장</h2><div id="market" class="market"><div class="empty">불러오는 중...</div></div><p id="ms" class="status">연결 확인 중</p></div>
<div class="grid"><div class="card"><h2>🔥 AI TOP PICKS <span class="status">KR + US</span></h2><div id="picks"><div class="empty">계산 중...</div></div></div><div class="card"><h2>🧠 점수 모델</h2><div id="model"></div></div></div>
<div class="card"><h2>⚡ 최신 금융뉴스</h2><div class="tabs"><button class="active" onclick="homeNews(this,'stocks finance economy Korea US','ko')">전체</button><button onclick="homeNews(this,'한국 경제 증시 코스피 코스닥','ko')">한국</button><button onclick="homeNews(this,'US stocks Wall Street Nasdaq S&P 500','en')">미국</button><button onclick="homeNews(this,'AI semiconductor NVIDIA AMD HBM','en')">AI·반도체</button></div><div id="news"><div class="empty">불러오는 중...</div></div></div></section>
<section id="newsPage" class="hidden"><div class="hero"><h1 id="nt">뉴스</h1><p class="muted">대표 금융·경제 뉴스</p></div><div class="card"><div id="nl"></div></div></section>
<section id="stockPage" class="hidden"><button onclick="goHome()">← 홈으로</button><div id="sd" class="card" style="margin-top:14px"></div></section></main>
<script>
const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(p){let r=await fetch(p,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'API 오류');return d}
function openMenu(){$('side').classList.add('open');$('ov').classList.add('open')}function closeMenu(){$('side').classList.remove('open');$('ov').classList.remove('open')}
function goHome(){closeMenu();$('home').classList.remove('hidden');$('newsPage').classList.add('hidden');$('stockPage').classList.add('hidden');scrollTo(0,0)}
function mcard(n,x){if(!x)return'';let c=(x.change||0)>=0?'up':'down';return`<div class="metric"><small>${esc(n)}</small><b>${x.price==null?'—':Number(x.price).toLocaleString(undefined,{maximumFractionDigits:2})}</b><div class="${c}">${x.change>=0?'+':''}${Number(x.change||0).toFixed(2)}%</div></div>`}
function render(id,a){$(id).innerHTML=(a||[]).slice(0,20).map(n=>`<div class="news">${n.image?`<img class="thumb" src="${esc(n.image)}">`:''}<div><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="meta">${esc(n.source)} · ${esc(n.timeText||'')}</div></div></div>`).join('')||'<div class="empty">뉴스가 없습니다.</div>'}
async function refreshAll(){try{let d=await api('/api/dashboard');$('market').innerHTML=mcard('NASDAQ',d.markets?.NASDAQ)+mcard('S&P 500',d.markets?.SP500)+mcard('KOSPI',d.markets?.KOSPI)+mcard('USD/KRW',d.markets?.USDKRW);$('ms').textContent='정상 · '+new Date(d.updatedAt).toLocaleTimeString('ko-KR');$('picks').innerHTML=(d.picks||[]).map(p=>`<div class="pick" onclick="openStock('${esc(p.symbol)}')"><div class="picktop"><div><b>${esc(p.name)}</b><div class="status">${esc(p.symbol)} · ${esc(p.market)}</div></div><div class="score">${p.score}</div></div><div class="status">${esc(p.view)}</div></div>`).join('')}catch(e){$('ms').textContent='연결 실패: '+e.message;$('market').innerHTML='<div class="empty">시장 데이터 오류</div>'}try{let n=await api('/api/news?q='+encodeURIComponent('stocks finance economy Korea US')+'&lang=ko');render('news',n.news)}catch(e){$('news').innerHTML='<div class="empty">뉴스를 불러오지 못했습니다.</div>'}}
function homeNews(el,q,l){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));el.classList.add('active');api('/api/news?q='+encodeURIComponent(q)+'&lang='+l).then(d=>render('news',d.news)).catch(()=>{})}
async function showNews(t,q,l='ko'){closeMenu();$('home').classList.add('hidden');$('stockPage').classList.add('hidden');$('newsPage').classList.remove('hidden');$('nt').textContent=t;$('nl').innerHTML='<div class="empty">불러오는 중...</div>';try{let d=await api('/api/news?q='+encodeURIComponent(q)+'&lang='+l);render('nl',d.news)}catch(e){$('nl').innerHTML='<div class="empty">뉴스 조회 실패</div>'}}
async function searchStock(){let q=$('q').value.trim();if(q)openStock(q)}
async function openStock(q){$('home').classList.add('hidden');$('newsPage').classList.add('hidden');$('stockPage').classList.remove('hidden');$('sd').innerHTML='<div class="empty">종목 분석 중...</div>';try{let d=await api('/api/dashboard?symbol='+encodeURIComponent(q)),s=d.stock;if(!s)throw Error('종목을 찾지 못했습니다.');$('sd').innerHTML=`<div><h1>${esc(s.name)}</h1><div class="status">${esc(s.symbol)} · ${esc(s.market)}</div></div><div class="big">${s.score}</div><p>${esc(s.verdict)}</p><canvas id="chart" class="chart"></canvas><div class="grid"><div class="card"><h2>🤖 AI 종합점수</h2>${Object.entries(s.metrics).map(([k,v])=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div><div class="card"><h2>👨‍💼 전문가 관점</h2><p class="op">${esc(s.expertView)}</p><p class="status">참고용 알고리즘 의견이며 실제 애널리스트 리포트가 아닙니다.</p></div></div><div class="card"><h2>📰 관련 뉴스</h2><div id="sn"></div></div>`;draw(s.history);render('sn',s.news)}catch(e){$('sd').innerHTML='<div class="empty">종목 분석 실패: '+esc(e.message)+'</div>'}}
function draw(a){let c=$('chart');if(!c||!a?.length)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=180*d;let x=c.getContext('2d');x.scale(d,d);let v=a.map(z=>z.close).filter(Number.isFinite),mn=Math.min(...v),mx=Math.max(...v);x.beginPath();v.forEach((z,i)=>{let px=10+i*(r.width-20)/Math.max(1,v.length-1),py=165-(z-mn)/(mx-mn||1)*135;i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle='#70a7ff';x.lineWidth=2;x.stroke()}
refreshAll();setInterval(refreshAll,300000);
</script></body></html>
