<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Stock Radar v7</title>
<style>
:root{--bg:#070a0f;--card:#10151d;--line:#253044;--text:#f4f7fb;--muted:#8d99ad;--accent:#65d6b1;--blue:#70a7ff;--red:#ff6f83}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070a0f,#0a0e15);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(7,10,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:20px}.spacer{flex:1}button,input{font:inherit}button{border:1px solid var(--line);background:#121923;color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}
.menuBtn{display:none}.wrap{max-width:1100px;margin:auto;padding:22px 18px 60px}
.hero{padding:18px 0 12px}.hero h1{font-size:36px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;min-width:0;background:#111720;color:white;border:1px solid var(--line);border-radius:13px;padding:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:rgba(16,21,29,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.card h2{margin:0 0 14px;font-size:21px}.market{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:14px;padding:13px}.metric small{display:block;color:var(--muted);margin-bottom:6px}.up{color:var(--accent)}.down{color:var(--red)}
.pick{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;margin:9px 0;cursor:pointer}.pick:hover{border-color:#5f7fa9}.score{font-size:24px;font-weight:800}.news{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #202936}.news:last-child{border:0}.thumb{width:105px;height:70px;object-fit:cover;border-radius:10px;background:#18202c}.news a{color:white;text-decoration:none;font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:6px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button.active{background:#20312f;border-color:#397565}.hidden{display:none}.bar{height:10px;background:#202937;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:10px}.detailTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.bigScore{font-size:48px;font-weight:900}.opinion{font-size:16px;color:#d8dfeb;line-height:1.6}.chart{width:100%;height:180px;background:#0b1017;border:1px solid var(--line);border-radius:14px}.side{position:fixed;inset:0 auto 0 0;width:290px;background:#0c1119;border-right:1px solid var(--line);padding:22px;z-index:30;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.side h3{margin-top:0}.side button{display:block;width:100%;text-align:left;margin:8px 0}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}.overlay.open{display:block}.status{color:var(--muted);font-size:13px}.empty{padding:20px 0;color:var(--muted)}
@media(max-width:700px){.menuBtn{display:block}.grid{grid-template-columns:1fr}.market{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:29px}.wrap{padding:16px 12px 45px}.news{gap:10px}.thumb{width:88px;height:62px}}
</style>
</head>
<body>
<div id="overlay" class="overlay" onclick="closeMenu()"></div>
<aside id="side" class="side">
<h3>☰ 메뉴</h3>
<button onclick="showNews('한국뉴스','한국 경제 증시 코스피 코스닥 기업')">🇰🇷 한국뉴스</button>
<button onclick="showNews('미국뉴스','US stocks Wall Street Nasdaq S&P 500 companies')">🇺🇸 미국뉴스</button>
<button onclick="showNews('AI·반도체','AI semiconductor NVIDIA AMD HBM')">🤖 AI·반도체</button>
<button onclick="showNews('금리·환율','Fed interest rates inflation dollar USD KRW')">💵 금리·환율</button>
<button onclick="showNews('기업뉴스','earnings stocks companies business')">🏢 기업뉴스</button>
<button onclick="goHome()">🏠 홈</button>
</aside>

<header><div class="nav">
<button class="menuBtn" onclick="openMenu()">☰</button>
<div class="logo">📡 AI Stock Radar</div><div class="spacer"></div>
<button onclick="refreshAll()">↻ 새로고침</button>
</div></header>

<main class="wrap">
<section id="home">
<div class="hero"><h1>AI 금융뉴스 & 주식 레이더</h1><p>한국·미국 시장을 한 화면에서 보고, 뉴스·가격·모멘텀을 함께 확인합니다.</p></div>
<div class="search"><input id="searchInput" placeholder="종목 검색: 삼성전자, NVDA, Apple..." onkeydown="if(event.key==='Enter')searchStock()"><button onclick="searchStock()">검색</button></div>

<div class="card"><h2>📊 글로벌 시장</h2><div id="market" class="market"><div class="empty">시장 데이터 불러오는 중...</div></div><p id="marketStatus" class="status">연결 확인 중</p></div>

<div class="grid">
<div class="card"><h2>🔥 AI TOP PICKS <span class="status">KR + US</span></h2><div id="picks"><div class="empty">계산 중...</div></div></div>
<div class="card"><h2>🧠 점수 모델</h2><div id="model"></div></div>
</div>

<div class="card"><h2>⚡ 최신 금융뉴스 <span class="status">한국 + 미국</span></h2><div class="tabs">
<button class="active" onclick="showNews('최신뉴스','stocks finance economy Korea US')">전체</button>
<button onclick="showNews('한국뉴스','한국 경제 증시 코스피 코스닥')">한국</button>
<button onclick="showNews('미국뉴스','US stocks Wall Street Nasdaq S&P 500')">미국</button>
<button onclick="showNews('AI·반도체','AI semiconductor NVIDIA AMD HBM')">AI·반도체</button>
</div><div id="news"></div></div>
</section>

<section id="newsPage" class="hidden">
<div class="hero"><h1 id="newsTitle">뉴스</h1><p>대표적인 금융·경제 뉴스만 모아봅니다.</p></div>
<div class="card"><div id="newsPageList"></div></div>
</section>

<section id="stockPage" class="hidden">
<button onclick="goHome()">← 홈으로</button>
<div id="stockDetail" class="card" style="margin-top:14px"><div class="empty">종목을 검색하세요.</div></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let newsCache=[];
function openMenu(){$('side').classList.add('open');$('overlay').classList.add('open')}
function closeMenu(){$('side').classList.remove('open');$('overlay').classList.remove('open')}
function goHome(){closeMenu();$('home').classList.remove('hidden');$('newsPage').classList.add('hidden');$('stockPage').classList.add('hidden');window.scrollTo(0,0)}
async function api(path){const r=await fetch(path,{cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'API 오류');return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function marketCard(name,x){if(!x)return '';const cls=(x.change||0)>=0?'up':'down';return `<div class="metric"><small>${esc(name)}</small><b>${esc(x.priceText||x.price||'-')}</b><div class="${cls}">${(x.change||0)>=0?'+':''}${Number(x.change||0).toFixed(2)}%</div></div>`}
async function refreshAll(){
$('marketStatus').textContent='데이터 연결 중...';
try{const d=await api('/api/dashboard');$('market').innerHTML=marketCard('NASDAQ',d.market?.NASDAQ)+marketCard('S&P 500',d.market?.SP500)+marketCard('KOSPI',d.market?.KOSPI)+marketCard('USD/KRW',d.market?.USDKRW);$('marketStatus').textContent='정상 · '+new Date(d.updatedAt).toLocaleTimeString('ko-KR');$('picks').innerHTML=(d.picks||[]).map(p=>`<div class="pick" onclick="openStock('${esc(p.symbol)}')"><div><b>${esc(p.name)}</b><div class="status">${esc(p.symbol)} · ${esc(p.market)}</div></div><div class="score">${Number(p.score||0)}</div></div>`).join('')||'<div class="empty">추천 데이터가 없습니다.</div>';let m=d.model||{news:30,price:25,volume:15,market:15,stability:15};$('model').innerHTML=Object.entries({뉴스 모멘텀:m.news,가격 모멘텀:m.price,거래량:m.volume,시장 모멘텀:m.market,변동성/안정성:m.stability}).map(([k,v])=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><span>${k}</span><span>${v}%</span></div><div class="bar"><i style="width:${v*3.33}%"></i></div></div>`).join('')}catch(e){$('marketStatus').textContent='연결 실패: '+e.message;$('market').innerHTML='<div class="empty">시장 데이터를 불러오지 못했습니다. 뉴스는 별도로 이용할 수 있습니다.</div>'}
try{const n=await api('/api/news?q='+encodeURIComponent('stocks finance economy Korea US')+'&lang=ko');newsCache=n.news||[];renderNews('news',newsCache)}catch(e){$('news').innerHTML='<div class="empty">뉴스를 불러오지 못했습니다. 잠시 후 다시 시도하세요.</div>'}
}
function renderNews(id,items){$(id).innerHTML=(items||[]).slice(0,20).map(n=>`<div class="news">${n.image?`<img class="thumb" src="${esc(n.image)}" onerror="this.style.display='none'">`:''}<div><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="meta">${esc(n.source)} · ${esc(n.timeText||'')}</div></div></div>`).join('')||'<div class="empty">뉴스가 없습니다.</div>'}
async function showNews(title,q){closeMenu();$('home').classList.add('hidden');$('stockPage').classList.add('hidden');$('newsPage').classList.remove('hidden');$('newsTitle').textContent=title;$('newsPageList').innerHTML='<div class="empty">뉴스 불러오는 중...</div>';try{const d=await api('/api/news?q='+encodeURIComponent(q)+'&lang='+(title==='미국뉴스'?'en':'ko'));renderNews('newsPageList',d.news)}catch(e){$('newsPageList').innerHTML='<div class="empty">뉴스 조회 실패: '+esc(e.message)+'</div>'}}
async function searchStock(){const q=$('searchInput').value.trim();if(!q)return;openStock(q)}
async function openStock(q){$('home').classList.add('hidden');$('newsPage').classList.add('hidden');$('stockPage').classList.remove('hidden');$('stockDetail').innerHTML='<div class="empty">종목 분석 중...</div>';try{const d=await api('/api/stock?symbol='+encodeURIComponent(q));const s=d.stock;const score=Number(d.score||0);$('stockDetail').innerHTML=`<div class="detailTop"><div><h1 style="margin:0 0 6px">${esc(s.name)}</h1><div class="status">${esc(s.symbol)} · ${esc(s.market)}</div></div><div class="bigScore">${score}</div></div><p>${esc(d.verdict||'참고용 분석')}</p><div class="card"><h2>📈 가격 그래프</h2><canvas id="chart" class="chart"></canvas></div><div class="grid"><div class="card"><h2>🤖 AI 종합점수</h2><div class="bar"><i style="width:${Math.min(score,100)}%"></i></div><p>뉴스 ${d.components?.news||0} · 가격 ${d.components?.price||0} · 시장 ${d.components?.market||0}</p></div><div class="card"><h2>👨‍💼 전문가 관점</h2><p class="opinion">${esc(d.expertView||'공개된 가격·뉴스 흐름을 바탕으로 한 참고용 요약입니다. 실제 애널리스트 의견과 동일하지 않습니다.')}</p></div></div><div class="card"><h2>📰 관련 뉴스</h2><div id="stockNews"></div></div>`;drawChart(s.history||[]);renderNews('stockNews',d.news||[])}catch(e){$('stockDetail').innerHTML='<div class="empty">종목 분석 실패: '+esc(e.message)+'</div>'}}
function drawChart(a){const c=$('chart');if(!c)return;const r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=180*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,r.width,180);if(!a.length)return;const vals=a.map(z=>z.close).filter(Number.isFinite),mn=Math.min(...vals),mx=Math.max(...vals);x.beginPath();vals.forEach((v,i)=>{const px=12+i*(r.width-24)/Math.max(1,vals.length-1),py=165-(v-mn)/(mx-mn||1)*135;i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle='#70a7ff';x.lineWidth=2;x.stroke()}
refreshAll();
setInterval(refreshAll,5*60*1000);
</script>
</body></html>
